spring:
  application:
    name: eventrush
  datasource:
    url: jdbc:h2:file:./data/eventrush;MODE=MySQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always

eventrush:
  stock:
    redis-enabled: false
  order:
    expire-seconds: 900
    timeout-scan-ms: 5000
