spring:
  application:
    name: eventrush
  datasource:
    url: jdbc:h2:file:./data/eventrush;MODE=MySQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: eventrush-grab-producer

eventrush:
  cache:
    redis-enabled: false
    event-detail-ttl-seconds: 300
  rate-limit:
    redis-enabled: false
    grab-limit: 3
    grab-window-seconds: 10
  stock:
    redis-enabled: false
  queue:
    redis-enabled: false
    rocket-enabled: false
    grab-key: eventrush:queue:grab
    consumer-scan-ms: 500
    rocket:
      topic: eventrush-grab-topic
      consumer-group: eventrush-grab-consumer
  order:
    expire-seconds: 900
    timeout-scan-ms: 5000
