spring:
  application:
    name: eventrush
  datasource:
    url: jdbc:h2:file:./data/eventrush;MODE=MySQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always

eventrush:
  cache:
    redis-enabled: false
    event-detail-ttl-seconds: 300
  rate-limit:
    redis-enabled: false
    grab-limit: 3
    grab-window-seconds: 10
  stock:
    redis-enabled: false
  queue:
    redis-enabled: false
    grab-key: eventrush:queue:grab
    result-ttl-seconds: 600
    consumer-scan-ms: 500
  order:
    expire-seconds: 900
    timeout-scan-ms: 5000
